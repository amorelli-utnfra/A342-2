<h1>Productos</h1>
<ul>
  <li *ngFor="let producto of productos()">
    <div class="item">{{ producto.nombre }} <button [routerLink]="['./detalle', producto.id]">Detalle</button></div>
</li>
</ul>

<div class="detalle">
  <p>Detalle del producto seleccionado</p>
  <router-outlet></router-outlet>
</div>
